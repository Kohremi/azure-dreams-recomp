format_version = 6
id = "azure.dungeon"
version = "1.0.0"
name = "Azure Dreams Dungeon Mods"
author = "Kohremi"
description = "Monster Tower tuning: monster density, item rarity and encounter tables. Generated by re/scripts/make_dungeon_mod.py."
license = "GPL-3.0"
resolver = "declarative"

[[target]]
game_id = "SLUS-00614"

[[feature]]
id = "monster-density"
name = "Monster Density"
description = "How many monsters a floor starts with and how often new ones appear (vanilla: 4-8 at start, one more every 32-63 turns, at most 32)."
group = "Dungeon"
default_enabled = false
channel = "experimental"

[[option]]
feature = "monster-density"
id = "start_min"
label = "Monsters at floor start (min)"
type = "integer"
min = 0
max = 30
step = 1
default = 4

[[option]]
feature = "monster-density"
id = "start_max"
label = "Monsters at floor start (max)"
type = "integer"
min = 0
max = 30
step = 1
default = 8

[[option]]
feature = "monster-density"
id = "spawn_base"
label = "Turns between spawns (minimum)"
type = "integer"
min = 1
max = 999
step = 1
default = 32

[[option]]
feature = "monster-density"
id = "spawn_spread"
label = "Extra random turns between spawns"
type = "choice"
default = "31"

[[option.choice]]
value = "0"
label = "0-0"

[[option.choice]]
value = "7"
label = "0-7"

[[option.choice]]
value = "15"
label = "0-15"

[[option.choice]]
value = "31"
label = "0-31"

[[option.choice]]
value = "63"
label = "0-63"

[[option.choice]]
value = "127"
label = "0-127"

[[patch]]  # li a0,4 (start min)
feature = "monster-density"
target = "disc_user"
offset = 0x18CC288
expected = "04 00"
replace_from = { option = "start_min", encoding = "u16le", offset = 0 }

[[patch]]  # li a1,8 (start max)
