[[feature]]
id = "fix-strength-talent"
name = "Fix: Strength Increased familiars"
description = "Each collared familiar with the Strength Increased talent was meant to add 1/8 to Koh's melee and sword mix-magic damage, but the check (dungeon FUN_800C82B8) reads Koh's talents instead of the familiar's, so it never applies. One-instruction fix."
group = "Gameplay Corrections"
default_enabled = false
channel = "experimental"

[[patch]]  # lw v0,0x54(a0) -> lw v0,0x54(v0)
feature = "fix-strength-talent"
target = "disc_user"
offset = 0x18EDB84
expected = "54 00 82 8c"
replace = "54 00 42 8c"

[[feature]]
id = "fix-gaia-shoot"
name = "Fix: Gaia Shoot element"
description = "DeoRock's mixture magic Gaia Shoot deals water damage although DeoRock is a wind spell (its fire/water siblings use their own element). Makes its damage wind-elemental."
group = "Gameplay Corrections"
default_enabled = false
channel = "experimental"

