# Japanese Voices: hand placements where the automatic alignment (re/scripts/voice_port.py) misses a
# voice or puts it on the wrong US line. Rebuild after editing: python re/scripts/voice_port.py, then
# build the game.
#
#   source = "town <JP chunk lba>" or a region name ("EXE: gift reactions", "tower: familiar talk",
#            "overlay 5071 (JP 5847)", ...), as listed in re/events/voices_missing.md
#   jp_op  = address of the Japanese voice op (the `30` before `1D`), from voices_missing.md,
#            voices.json (jp_op) or `python re/scripts/voice_where.py "<source>"`
#   us     = the US line the voice starts on: the start of its text ("Oh, you’re awake.") or "0x8001xxxx"
#   as     = "line" (default: plays when the line starts), "follow" (plays after the line's own voice,
#            while its box waits), "drop" (never play this voice)
#   through = n: the voice keeps playing through the next n button waits (the US split its text over
#            more boxes); a placed voice otherwise stops at its box's button, as in the Japanese game

# --- the naming scene (US 6642): JP has an actor op before every box, the US one for the whole scene
